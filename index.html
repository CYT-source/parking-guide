<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>停车包期充值指南</title>
<style>
body{margin:0;background:#f4f1ee;color:#624d43;font:16px/1.75 -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}main{max-width:680px;margin:auto;padding:32px 20px;background:#fffdfb;min-height:100vh}h1,h2{color:#876755}header{text-align:center;border-bottom:1px solid #eadbd3}section{padding:18px 0;border-bottom:1px solid #eadbd3}.box{background:#fff;padding:16px;border:1px solid #eadbd3;border-radius:12px}.warn{color:#c75e4e;font-weight:bold}.qr{display:block;width:min(100%,310px);margin:18px auto;border:12px solid #f3f0ec}table{width:100%;border-collapse:collapse}td,th{border:1px solid #c9aa99;padding:12px;text-align:center}th{background:#f5e9e3}footer{text-align:center;color:#987f72;font-size:13px;padding-top:20px}
</style>
</head>
<body><main id="app">正在加载…</main>
<script>
fetch("./content.json").then(r=>r.json()).then(d=>{
  const list=a=>"<ol>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ol>";
  document.title=d.title;
  document.querySelector("#app").innerHTML=
    "<header><h1>"+d.title+"</h1><p>"+d.subtitle+"</p></header>"+
    "<section class=box>"+d.intro+"</section>"+
    "<section><h2>1. 进入缴费页面</h2><p>"+d.entry+"</p><img class=qr alt=外部车辆包期缴费二维码 src=assets/qr.svg></section>"+
    "<section><h2>2. 充值缴费</h2>"+list(d.recharge)+"<p class=warn>"+d.plateNotice+"</p></section>"+
    "<section><h2>收费标准</h2><table><tr><th>包期规则</th><th>收费标准</th></tr>"+d.rates.map(x=>"<tr><td>"+x[0]+"</td><td>"+x[1]+"</td></tr>").join("")+"</table><p class=warn>"+d.paidNotice+"</p></section>"+
    "<section><h2>遇到问题，请联系我们</h2>"+d.contacts.map(x=>"<p>"+x[0]+"：<strong>"+x[1]+"</strong></p>").join("")+"</section>"+
    "<section><h2>续费说明</h2>"+list(d.renewal)+"</section><footer>"+d.footer+"</footer>";
}).catch(()=>document.querySelector("#app").textContent="内容加载失败，请稍后重试。");
</script></body></html>
